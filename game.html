<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backyard Innings — Jason Merlino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0908;
    --red: #d21f27;
    --green: #3ddc4f;
    --cream: #f3ede2;
    --muted: #948d80;
    --hairline: rgba(243,237,226,0.14);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--black);
    color: var(--cream);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px clamp(20px, 5vw, 48px);
  }
  .mark {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 24px;
    text-decoration: none;
  }
  .back-link {
    font-size: 14px;
    text-decoration: none;
    color: var(--muted);
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 3px;
  }
  .back-link:hover { color: var(--red); border-color: var(--red); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 20px 40px;
    gap: 30px;
  }

  h1.title {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(32px, 5.5vw, 48px);
    color: var(--red);
    margin: 0;
  }

  .scoreboard {
    display: flex;
    gap: 40px;
    align-items: center;
  }
  .stat { text-align: center; }
  .stat .num {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 34px;
    color: var(--green);
    line-height: 1;
  }
  .stat .label { font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: 0.02em; }
  .dots { display: flex; gap: 6px; margin-top: 8px; justify-content: center; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    border: 1px solid var(--muted);
  }
  .dot.filled { background: var(--red); border-color: var(--red); }

  .bases-diamond {
    position: relative;
    width: 40px;
    height: 40px;
    margin: 3px auto 0;
  }
  .base-marker {
    position: absolute;
    width: 12px;
    height: 12px;
    background: transparent;
    border: 2px solid var(--muted);
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .base-marker.second { top: 0; left: 50%; }
  .base-marker.first { top: 50%; left: 100%; }
  .base-marker.third { top: 50%; left: 0; }
  .base-marker.home {
    top: 100%; left: 50%;
    background: var(--cream);
    border-color: var(--cream);
  }
  .base-marker.occupied { background: var(--red); border-color: var(--red); }

  .field {
    position: relative;
    width: min(400px, 90vw);
    height: 320px;
    margin: 0 auto;
    border-radius: 16px;
    border: 1px solid var(--hairline);
    overflow: hidden;
    background:
      linear-gradient(180deg, #7fb3d9 0px, #a9d3ea 40px, transparent 40px),
      repeating-linear-gradient(180deg, #1c4522 68px, #1c4522 84px, #173a1d 84px, #173a1d 106px),
      repeating-linear-gradient(180deg, #16341c 0px, #16341c 22px, #123016 22px, #123016 44px);
  }
  .stands {
    position: absolute;
    top: 40px; left: 0; right: 0;
    height: 20px;
    background: repeating-linear-gradient(90deg, #736a63 0px, #736a63 5px, #857a72 5px, #857a72 10px);
    z-index: 1;
  }
  .light-tower {
    position: absolute;
    top: 4px;
    width: 4px;
    height: 34px;
    background: #3a3733;
    z-index: 2;
  }
  .light-tower::before {
    content: "";
    position: absolute;
    top: -8px; left: -7px;
    width: 18px; height: 10px;
    background: #f4d35e;
    box-shadow: 0 0 10px 2px rgba(244,211,94,0.5);
    border-radius: 2px;
  }
  .light-tower.left { left: 22px; }
  .light-tower.right { right: 22px; }
  .wall {
    position: absolute;
    top: 60px; left: 0; right: 0;
    height: 9px;
    background: #1c4522;
    border-top: 2px solid #e8d24a;
    z-index: 1;
  }
  .infield {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 300px;
    height: 220px;
    transform: translateX(-50%);
    background: #7c5636;
    clip-path: polygon(43% 8%, 57% 8%, 88% 100%, 12% 100%);
  }
  .infield::before {
    content: "";
    position: absolute;
    inset: 30px 44px 14px 44px;
    background: #16341c;
    clip-path: polygon(38% 0%, 62% 0%, 100% 100%, 0% 100%);
  }
  .mound {
    position: absolute;
    left: 50%;
    bottom: 168px;
    width: 30px;
    height: 12px;
    border-radius: 50%;
    background: #6b4a30;
    transform: translateX(-50%);
  }
  .sweet-zone {
    position: absolute;
    left: 50%;
    bottom: 40px;
    width: 130px;
    height: 20px;
    transform: translateX(-50%);
    background: rgba(61,220,79,0.14);
    border-top: 1px dashed rgba(61,220,79,0.45);
    border-bottom: 1px dashed rgba(61,220,79,0.45);
  }
  .plate {
    position: absolute;
    left: 50%;
    bottom: 22px;
    width: 20px;
    height: 20px;
    background: var(--cream);
    transform: translateX(-50%);
    clip-path: polygon(50% 0%, 100% 35%, 100% 100%, 0% 100%, 0% 35%);
  }
  .figure {
    position: absolute;
    width: 42px;
    height: 66px;
    left: 50%;
  }
  .figure.pitcher {
    bottom: 148px;
    transform: translateX(calc(-50% - 14px)) scale(0.62);
  }
  .figure.batter {
    bottom: -2px;
    transform: translateX(calc(-50% + 30px)) scale(1.05);
  }
  .figure svg { width: 100%; height: 100%; }

  .ball {
    position: absolute;
    left: 50%;
    bottom: 168px;
    width: 16px;
    height: 16px;
    margin-left: -8px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--red) 70%);
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 3;
  }
  .ball.flying { opacity: 1; }

  #pitcherArm { transform: rotate(0deg); }
  #pitcherArm.throwing {
    animation: pitchThrow var(--pitch-time, 450ms) ease-out 1;
  }
  @keyframes pitchThrow {
    0%   { transform: rotate(0deg); }
    35%  { transform: rotate(-45deg); }
    100% { transform: rotate(85deg); }
  }

  #batterBat { transform: rotate(0deg); }
  #batterBat.swinging {
    animation: batSwing 220ms cubic-bezier(.25,.7,.3,1) 1;
  }
  @keyframes batSwing {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(-125deg); }
  }

  .result-banner {
    min-height: 30px;
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--cream);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .result-banner.show { opacity: 1; }
  .result-banner.hit { color: var(--green); }
  .result-banner.bad { color: var(--red); }

  .controls { display: flex; gap: 20px; }
  button.action {
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--cream);
    font-family: inherit;
    font-size: 16px;
    padding: 16px 40px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, opacity 0.2s;
  }
  button.action:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
  button.action:disabled { opacity: 0.3; cursor: default; }
  button.action.primary { background: var(--red); border-color: var(--red); color: var(--cream); }
  button.action.primary:hover:not(:disabled) { opacity: 0.88; color: var(--cream); }

  .final {
    position: fixed;
    inset: 0;
    z-index: 25;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(10,9,8,0.92);
    backdrop-filter: blur(4px);
    padding: 20px;
  }
  .final.show { display: flex; }
  .final h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(32px, 6vw, 48px);
    color: var(--red);
    margin: 0 0 10px;
  }
  .final .score {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 60px;
    color: var(--green);
    margin: 0 0 8px;
  }
  .final p { color: var(--muted); max-width: 40ch; font-size: 15px; margin: 0 0 28px; }
</style>
</head>
<body>
  <header>
    <a class="mark" href="index.html">JM</a>
    <a class="back-link" href="index.html">&larr; Back to reality</a>
  </header>

  <main>
    <h1 class="title">Backyard Innings</h1>

    <div class="scoreboard">
      <div class="stat">
        <div class="num" id="scoreNum">0</div>
        <div class="label">score</div>
      </div>
      <div class="stat">
        <div class="dots" id="strikeDots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="label">strikes</div>
      </div>
      <div class="stat">
        <div class="dots" id="outDots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="label">outs</div>
      </div>
      <div class="stat">
        <div class="bases-diamond">
          <div class="base-marker second" id="baseSecond"></div>
          <div class="base-marker first" id="baseFirst"></div>
          <div class="base-marker home"></div>
          <div class="base-marker third" id="baseThird"></div>
        </div>
        <div class="label">bases</div>
      </div>
    </div>

    <div class="field">
      <div class="stands" aria-hidden="true"></div>
      <div class="light-tower left" aria-hidden="true"></div>
      <div class="light-tower right" aria-hidden="true"></div>
      <div class="wall" aria-hidden="true"></div>
      <div class="infield" aria-hidden="true"></div>
      <div class="mound" aria-hidden="true"></div>
      <div class="sweet-zone" aria-hidden="true"></div>
      <div class="plate" aria-hidden="true"></div>
      <div class="figure pitcher">
        <svg viewBox="0 0 40 66" fill="none" stroke="#f3ede2" stroke-width="3" stroke-linecap="round">
          <path d="M11 7 A8 8 0 0 1 25 7" fill="#d21f27" stroke="none" />
          <circle cx="18" cy="10" r="7" />
          <line x1="18" y1="17" x2="18" y2="40" />
          <line x1="18" y1="40" x2="8" y2="60" />
          <line x1="18" y1="40" x2="27" y2="52" />
          <g id="pitcherArm" style="transform-origin: 18px 22px;">
            <line x1="18" y1="22" x2="4" y2="10" stroke="#d21f27" />
          </g>
          <line x1="18" y1="24" x2="29" y2="18" />
        </svg>
      </div>
      <div class="figure batter">
        <svg viewBox="0 0 40 66" fill="none" stroke="#f3ede2" stroke-width="3" stroke-linecap="round">
          <path d="M11 7 A8 8 0 0 1 25 7" fill="#2196f3" stroke="none" />
          <circle cx="18" cy="10" r="7" />
          <line x1="18" y1="17" x2="18" y2="40" />
          <line x1="18" y1="40" x2="8" y2="60" />
          <line x1="18" y1="40" x2="28" y2="60" />
          <line x1="18" y1="22" x2="12" y2="28" />
          <line x1="18" y1="22" x2="12" y2="32" />
          <g id="batterBat" style="transform-origin: 12px 30px;">
            <line x1="12" y1="30" x2="6" y2="18" stroke="#c69a5b" stroke-width="2.4" stroke-linecap="round" />
            <line x1="6" y1="18" x2="-2" y2="3" stroke="#dcb583" stroke-width="5.2" stroke-linecap="round" />
            <circle cx="12" cy="30" r="1.8" fill="#c69a5b" stroke="none" />
          </g>
        </svg>
      </div>
      <div class="ball" id="ball"></div>
    </div>

    <div class="result-banner" id="banner"></div>

    <div class="controls">
      <button class="action primary" id="pitchBtn">Pitch</button>
      <button class="action" id="swingBtn" disabled>Swing</button>
    </div>
  </main>

  <div class="final" id="final">
    <h1>Game over</h1>
    <div class="score" id="finalScore">0</div>
    <p id="finalComment">final score.</p>
    <button class="action primary" id="retryBtn">Play again</button>
  </div>

<script>
  const pitchBtn = document.getElementById('pitchBtn');
  const swingBtn = document.getElementById('swingBtn');
  const ball = document.getElementById('ball');
  const banner = document.getElementById('banner');
  const scoreNum = document.getElementById('scoreNum');
  const strikeDots = document.querySelectorAll('#strikeDots .dot');
  const outDots = document.querySelectorAll('#outDots .dot');
  const finalScreen = document.getElementById('final');
  const finalScore = document.getElementById('finalScore');
  const finalComment = document.getElementById('finalComment');
  const retryBtn = document.getElementById('retryBtn');
  const pitcherArm = document.getElementById('pitcherArm');
  const batterBat = document.getElementById('batterBat');
  const baseFirst = document.getElementById('baseFirst');
  const baseSecond = document.getElementById('baseSecond');
  const baseThird = document.getElementById('baseThird');

  let score = 0, strikes = 0, outs = 0;
  let bases = [false, false, false]; // 1st, 2nd, 3rd
  let pitchStart = 0, pitchDuration = 0, pitchActive = false, resolveTimer = null;

  function updateDots(el, filled) {
    el.forEach((d, i) => d.classList.toggle('filled', i < filled));
  }

  function updateBasesUI() {
    baseFirst.classList.toggle('occupied', bases[0]);
    baseSecond.classList.toggle('occupied', bases[1]);
    baseThird.classList.toggle('occupied', bases[2]);
  }

  // basesAdvance: 1=single, 2=double, 3=triple, 4=home run.
  // Existing runners move up that many bases; anyone pushed past 3rd scores.
  // Returns how many runs scored on the play.
  function advanceRunners(basesAdvance) {
    const newBases = [false, false, false];
    let runs = 0;
    for (let i = 0; i < 3; i++) {
      if (!bases[i]) continue;
      const newPos = (i + 1) + basesAdvance;
      if (newPos >= 4) runs++;
      else newBases[newPos - 1] = true;
    }
    if (basesAdvance >= 4) runs++;
    else newBases[basesAdvance - 1] = true;
    bases = newBases;
    updateBasesUI();
    return runs;
  }

  function showBanner(text, cls) {
    banner.textContent = text;
    banner.className = 'result-banner show' + (cls ? ' ' + cls : '');
  }

  const MOUND_Y = 168, PLATE_Y = 26;
  let hitAnimId = null;

  function resetBallVisual() {
    if (hitAnimId) cancelAnimationFrame(hitAnimId);
    ball.style.opacity = '';
    ball.style.left = '50%';
    ball.style.bottom = MOUND_Y + 'px';
    ball.style.transform = 'scale(0.55)';
    ball.classList.remove('flying');
    void ball.offsetWidth;
  }

  function resetFigures() {
    pitcherArm.classList.remove('throwing');
    batterBat.classList.remove('swinging');
    void pitcherArm.offsetWidth;
  }

  function startPitch() {
    pitchBtn.disabled = true;
    swingBtn.disabled = false;
    showBanner('', '');
    resetBallVisual();
    resetFigures();

    pitchDuration = 700 + Math.random() * 550;
    pitchStart = performance.now();
    pitchActive = true;

    pitcherArm.style.setProperty('--pitch-time', `${pitchDuration * 0.55}ms`);
    pitcherArm.classList.add('throwing');

    ball.classList.add('flying');
    const wobble = (Math.random() - 0.5) * 22;

    function flyBall(now) {
      const t = Math.min(1, (now - pitchStart) / pitchDuration);
      const y = MOUND_Y + (PLATE_Y - MOUND_Y) * t;
      const x = 50 + Math.sin(Math.PI * t) * (wobble / 4);
      const scale = 0.55 + 0.65 * t;
      ball.style.left = x + '%';
      ball.style.bottom = y + 'px';
      ball.style.transform = `scale(${scale})`;
      if (t < 1 && pitchActive) requestAnimationFrame(flyBall);
    }
    requestAnimationFrame(flyBall);

    resolveTimer = setTimeout(() => {
      if (pitchActive) strikeOut('looking');
    }, pitchDuration + 220);
  }

  function endAtBat(delayMs) {
    pitchActive = false;
    clearTimeout(resolveTimer);
    swingBtn.disabled = true;
    setTimeout(() => { if (outs < 3) pitchBtn.disabled = false; }, delayMs || 500);
  }

  function strikeOut(kind) {
    endAtBat(500);
    strikes++;
    if (strikes >= 3) {
      showBanner(kind === 'looking' ? 'strike three, looking.' : 'strike three.', 'bad');
      outs++;
      updateDots(outDots, outs);
      strikes = 0;
      updateDots(strikeDots, 0);
      if (outs >= 3) return gameOver();
    } else {
      showBanner(kind === 'looking' ? 'strike, looking.' : 'strike.', 'bad');
      updateDots(strikeDots, strikes);
    }
  }

  function animateHitBall({ toY, toXPercent, toScale, duration, fadeFrom }) {
    const fromY = PLATE_Y + 6;
    const fromX = 50;
    const fromScale = 1.0;
    const start = performance.now();

    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      const ease = 1 - Math.pow(1 - t, 2);
      const y = fromY + (toY - fromY) * ease;
      const x = fromX + (toXPercent - fromX) * ease;
      const scale = fromScale + (toScale - fromScale) * ease;
      ball.style.bottom = y + 'px';
      ball.style.left = x + '%';
      ball.style.transform = `scale(${scale})`;
      if (t >= fadeFrom) {
        const fadeT = (t - fadeFrom) / (1 - fadeFrom);
        ball.style.opacity = String(1 - fadeT);
      }
      if (t < 1) hitAnimId = requestAnimationFrame(step);
      else ball.classList.remove('flying');
    }
    hitAnimId = requestAnimationFrame(step);
  }

  function foulBall() {
    endAtBat(650);
    showBanner('foul ball.', '');
    const side = Math.random() < 0.5 ? -1 : 1;
    animateHitBall({
      toY: 90 + Math.random() * 40,
      toXPercent: 50 + side * (55 + Math.random() * 25),
      toScale: 0.6,
      duration: 550,
      fadeFrom: 0.55
    });
  }

  function hit(kind, basesAdvance) {
    endAtBat(1000);
    const runs = advanceRunners(basesAdvance);
    score += runs;
    scoreNum.textContent = score;
    const runText = runs === 0 ? '' : runs === 1 ? ' 1 run scores!' : ` ${runs} runs score!`;
    showBanner(kind + runText, 'hit');

    const spread = (Math.random() - 0.5) * 50;
    const targets = {
      1: { toY: 118, toScale: 0.82, duration: 650, fadeFrom: 0.8 },
      2: { toY: 172, toScale: 0.62, duration: 750, fadeFrom: 0.75 },
      3: { toY: 232, toScale: 0.42, duration: 850, fadeFrom: 0.72 },
      4: { toY: 340, toScale: 0.22, duration: 950, fadeFrom: 0.6 }
    };
    const t = targets[basesAdvance];
    animateHitBall({
      toY: t.toY,
      toXPercent: 50 + spread,
      toScale: t.toScale,
      duration: t.duration,
      fadeFrom: t.fadeFrom
    });
  }

  pitchBtn.addEventListener('click', startPitch);

  swingBtn.addEventListener('click', () => {
    if (!pitchActive) return;
    batterBat.classList.remove('swinging');
    void batterBat.offsetWidth;
    batterBat.classList.add('swinging');
    const now = performance.now();
    const idealArrival = pitchStart + pitchDuration;
    const diff = Math.abs(now - idealArrival);

    if (diff <= 60) hit('HOME RUN!', 4);
    else if (diff <= 150) hit('triple!', 3);
    else if (diff <= 260) hit('double.', 2);
    else if (diff <= 400) hit('single.', 1);
    else if (diff <= pitchDuration * 0.9) foulBall();
    else strikeOut('swinging');
  });

  function gameOver() {
    setTimeout(() => {
      finalScore.textContent = score;
      let comment = 'final score.';
      if (score === 0) comment = "tough inning. everybody has one.";
      else if (score < 6) comment = "you'll get 'em next time.";
      else if (score < 14) comment = "solid at-bats.";
      else comment = "backyard legend.";
      finalComment.textContent = comment;
      finalScreen.classList.add('show');
    }, 700);
  }

  retryBtn.addEventListener('click', () => {
    score = 0; strikes = 0; outs = 0;
    bases = [false, false, false];
    scoreNum.textContent = '0';
    updateDots(strikeDots, 0);
    updateDots(outDots, 0);
    updateBasesUI();
    finalScreen.classList.remove('show');
    showBanner('', '');
    resetBallVisual();
    resetFigures();
    pitchBtn.disabled = false;
    swingBtn.disabled = true;
  });
</script>
</body>
</html>
