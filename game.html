<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backyard Innings — Jason Merlino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0908;
    --red: #d21f27;
    --green: #3ddc4f;
    --cream: #f3ede2;
    --muted: #948d80;
    --hairline: rgba(243,237,226,0.14);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--black);
    color: var(--cream);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px clamp(20px, 5vw, 48px);
  }
  .mark {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 24px;
    text-decoration: none;
  }
  .back-link {
    font-size: 14px;
    text-decoration: none;
    color: var(--muted);
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 3px;
  }
  .back-link:hover { color: var(--red); border-color: var(--red); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 20px 40px;
    gap: 30px;
  }

  h1.title {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(32px, 5.5vw, 48px);
    color: var(--red);
    margin: 0;
  }

  .scoreboard {
    display: flex;
    gap: 40px;
    align-items: center;
  }
  .stat { text-align: center; }
  .stat .num {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 34px;
    color: var(--green);
    line-height: 1;
  }
  .stat .label { font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: 0.02em; }
  .dots { display: flex; gap: 6px; margin-top: 8px; justify-content: center; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    border: 1px solid var(--muted);
  }
  .dot.filled { background: var(--red); border-color: var(--red); }

  .field {
    position: relative;
    width: min(560px, 90vw);
    height: 210px;
    border-radius: 16px;
    border: 1px solid var(--hairline);
    overflow: hidden;
    background: repeating-linear-gradient(180deg, #16341c 0px, #16341c 22px, #123016 22px, #123016 44px);
  }
  .sun {
    position: absolute;
    top: 10px; left: 14px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #f4d35e;
    box-shadow: 0 0 14px 3px rgba(244,211,94,0.35);
  }
  .cloud {
    position: absolute;
    top: 16px; right: 16%;
    width: 46px; height: 14px;
    background: rgba(243,237,226,0.5);
    border-radius: 999px;
  }
  .cloud::before {
    content: "";
    position: absolute;
    top: -8px; left: 8px;
    width: 24px; height: 18px;
    background: rgba(243,237,226,0.5);
    border-radius: 50%;
  }
  .fence {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 12px;
    background: repeating-linear-gradient(90deg, #8a6339 0px, #8a6339 4px, transparent 4px, transparent 12px);
    opacity: 0.55;
  }
  .diamond {
    position: absolute;
    left: 50%;
    bottom: -74px;
    width: 130px;
    height: 130px;
    background: #7c5636;
    border: 2px solid rgba(0,0,0,0.2);
    transform: translateX(-50%) rotate(45deg);
    border-radius: 6px;
    opacity: 0.9;
  }
  .diamond::before {
    content: "";
    position: absolute;
    inset: 14px;
    background: repeating-linear-gradient(180deg, #1a3e20 0px, #1a3e20 10px, #163a1c 10px, #163a1c 20px);
    border-radius: 4px;
  }
  .figure {
    position: absolute;
    top: 14px;
    width: 42px;
    height: 66px;
  }
  .figure.pitcher { left: 10%; }
  .figure.batter { right: 8%; transform: scaleX(-1); }
  .figure svg { width: 100%; height: 100%; }

  .mound {
    position: absolute;
    left: calc(10% + 2px);
    bottom: 62px;
    width: 30px;
    height: 12px;
    border-radius: 50%;
    background: #6b4a30;
  }
  .base-path {
    position: absolute;
    left: 8%;
    right: 6%;
    bottom: 56px;
    height: 34px;
    border-radius: 999px;
    background: linear-gradient(90deg, #6b4a30, #7c5636);
    border: 1px solid rgba(0,0,0,0.25);
  }
  .sweet-zone {
    position: absolute;
    right: 8%;
    top: 0; bottom: 0;
    width: 12%;
    background: rgba(61,220,79,0.16);
    border-left: 1px dashed rgba(61,220,79,0.45);
    border-right: 1px dashed rgba(61,220,79,0.45);
  }
  .plate {
    position: absolute;
    right: 2%;
    bottom: 66px;
    width: 14px;
    height: 14px;
    background: var(--cream);
    clip-path: polygon(50% 0%, 100% 35%, 100% 100%, 0% 100%, 0% 35%);
  }
  .ball {
    position: absolute;
    left: 3%;
    bottom: 68px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--red) 70%);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .ball.flying { opacity: 1; }

  #pitcherArm { transform: rotate(0deg); }
  #pitcherArm.throwing {
    animation: pitchThrow var(--pitch-time, 450ms) ease-out 1;
  }
  @keyframes pitchThrow {
    0%   { transform: rotate(0deg); }
    35%  { transform: rotate(-45deg); }
    100% { transform: rotate(85deg); }
  }

  #batterBat { transform: rotate(0deg); }
  #batterBat.swinging {
    animation: batSwing 220ms cubic-bezier(.25,.7,.3,1) 1;
  }
  @keyframes batSwing {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(-125deg); }
  }

  .result-banner {
    min-height: 30px;
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--cream);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .result-banner.show { opacity: 1; }
  .result-banner.hit { color: var(--green); }
  .result-banner.bad { color: var(--red); }

  .controls { display: flex; gap: 20px; }
  button.action {
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--cream);
    font-family: inherit;
    font-size: 16px;
    padding: 16px 40px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, opacity 0.2s;
  }
  button.action:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
  button.action:disabled { opacity: 0.3; cursor: default; }
  button.action.primary { background: var(--red); border-color: var(--red); color: var(--cream); }
  button.action.primary:hover:not(:disabled) { opacity: 0.88; color: var(--cream); }

  .final {
    position: fixed;
    inset: 0;
    z-index: 25;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(10,9,8,0.92);
    backdrop-filter: blur(4px);
    padding: 20px;
  }
  .final.show { display: flex; }
  .final h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(32px, 6vw, 48px);
    color: var(--red);
    margin: 0 0 10px;
  }
  .final .score {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 60px;
    color: var(--green);
    margin: 0 0 8px;
  }
  .final p { color: var(--muted); max-width: 40ch; font-size: 15px; margin: 0 0 28px; }
</style>
</head>
<body>
  <header>
    <a class="mark" href="index.html">JM</a>
    <a class="back-link" href="index.html">&larr; Back to reality</a>
  </header>

  <main>
    <h1 class="title">Backyard Innings</h1>

    <div class="scoreboard">
      <div class="stat">
        <div class="num" id="scoreNum">0</div>
        <div class="label">score</div>
      </div>
      <div class="stat">
        <div class="dots" id="strikeDots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="label">strikes</div>
      </div>
      <div class="stat">
        <div class="dots" id="outDots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="label">outs</div>
      </div>
    </div>

    <div class="field">
      <div class="sun" aria-hidden="true"></div>
      <div class="cloud" aria-hidden="true"></div>
      <div class="fence" aria-hidden="true"></div>
      <div class="diamond" aria-hidden="true"></div>
      <div class="figure pitcher">
        <svg viewBox="0 0 40 66" fill="none" stroke="#f3ede2" stroke-width="3" stroke-linecap="round">
          <path d="M11 7 A8 8 0 0 1 25 7" fill="#d21f27" stroke="none" />
          <circle cx="18" cy="10" r="7" />
          <line x1="18" y1="17" x2="18" y2="40" />
          <line x1="18" y1="40" x2="8" y2="60" />
          <line x1="18" y1="40" x2="27" y2="52" />
          <g id="pitcherArm" style="transform-origin: 18px 22px;">
            <line x1="18" y1="22" x2="4" y2="10" stroke="#d21f27" />
          </g>
          <line x1="18" y1="24" x2="29" y2="18" />
        </svg>
      </div>
      <div class="figure batter">
        <svg viewBox="0 0 40 66" fill="none" stroke="#f3ede2" stroke-width="3" stroke-linecap="round">
          <path d="M11 7 A8 8 0 0 1 25 7" fill="#2196f3" stroke="none" />
          <circle cx="18" cy="10" r="7" />
          <line x1="18" y1="17" x2="18" y2="40" />
          <line x1="18" y1="40" x2="8" y2="60" />
          <line x1="18" y1="40" x2="28" y2="60" />
          <line x1="18" y1="22" x2="12" y2="28" />
          <line x1="18" y1="22" x2="12" y2="32" />
          <g id="batterBat" style="transform-origin: 12px 30px;">
            <line x1="12" y1="30" x2="0" y2="6" stroke="#d21f27" stroke-width="3.5" />
          </g>
        </svg>
      </div>
      <div class="mound"></div>
      <div class="base-path">
        <div class="sweet-zone"></div>
      </div>
      <div class="plate"></div>
      <div class="ball" id="ball"></div>
    </div>

    <div class="result-banner" id="banner"></div>

    <div class="controls">
      <button class="action primary" id="pitchBtn">Pitch</button>
      <button class="action" id="swingBtn" disabled>Swing</button>
    </div>
  </main>

  <div class="final" id="final">
    <h1>Game over</h1>
    <div class="score" id="finalScore">0</div>
    <p id="finalComment">final score.</p>
    <button class="action primary" id="retryBtn">Play again</button>
  </div>

<script>
  const pitchBtn = document.getElementById('pitchBtn');
  const swingBtn = document.getElementById('swingBtn');
  const ball = document.getElementById('ball');
  const banner = document.getElementById('banner');
  const scoreNum = document.getElementById('scoreNum');
  const strikeDots = document.querySelectorAll('#strikeDots .dot');
  const outDots = document.querySelectorAll('#outDots .dot');
  const finalScreen = document.getElementById('final');
  const finalScore = document.getElementById('finalScore');
  const finalComment = document.getElementById('finalComment');
  const retryBtn = document.getElementById('retryBtn');
  const pitcherArm = document.getElementById('pitcherArm');
  const batterBat = document.getElementById('batterBat');

  let score = 0, strikes = 0, outs = 0;
  let pitchStart = 0, pitchDuration = 0, pitchActive = false, resolveTimer = null;

  function updateDots(el, filled) {
    el.forEach((d, i) => d.classList.toggle('filled', i < filled));
  }

  function showBanner(text, cls) {
    banner.textContent = text;
    banner.className = 'result-banner show' + (cls ? ' ' + cls : '');
  }

  function resetBallVisual() {
    ball.style.left = '13%';
    ball.style.bottom = '68px';
    ball.classList.remove('flying');
    void ball.offsetWidth;
  }

  function resetFigures() {
    pitcherArm.classList.remove('throwing');
    batterBat.classList.remove('swinging');
    void pitcherArm.offsetWidth;
  }

  function startPitch() {
    pitchBtn.disabled = true;
    swingBtn.disabled = false;
    showBanner('', '');
    resetBallVisual();
    resetFigures();

    pitchDuration = 700 + Math.random() * 550;
    pitchStart = performance.now();
    pitchActive = true;

    pitcherArm.style.setProperty('--pitch-time', `${pitchDuration * 0.55}ms`);
    pitcherArm.classList.add('throwing');

    ball.classList.add('flying');
    const startX = 13, endX = 84;
    const baseY = 68;
    const arcHeight = 26 + Math.random() * 18;
    const wobble = (Math.random() - 0.5) * 10;

    function flyBall(now) {
      const t = Math.min(1, (now - pitchStart) / pitchDuration);
      const x = startX + (endX - startX) * t;
      const y = baseY + Math.sin(Math.PI * t) * arcHeight + Math.sin(Math.PI * t * 2) * wobble * 0.3;
      ball.style.left = x + '%';
      ball.style.bottom = y + 'px';
      if (t < 1 && pitchActive) requestAnimationFrame(flyBall);
    }
    requestAnimationFrame(flyBall);

    resolveTimer = setTimeout(() => {
      if (pitchActive) strikeOut('looking');
    }, pitchDuration + 220);
  }

  function endAtBat(wasStrike) {
    pitchActive = false;
    clearTimeout(resolveTimer);
    swingBtn.disabled = true;
    setTimeout(() => { if (outs < 3) pitchBtn.disabled = false; }, 500);
  }

  function strikeOut(kind) {
    endAtBat(true);
    strikes++;
    if (strikes >= 3) {
      showBanner(kind === 'looking' ? 'strike three, looking.' : 'strike three.', 'bad');
      outs++;
      updateDots(outDots, outs);
      strikes = 0;
      updateDots(strikeDots, 0);
      if (outs >= 3) return gameOver();
    } else {
      showBanner(kind === 'looking' ? 'strike, looking.' : 'strike.', 'bad');
      updateDots(strikeDots, strikes);
    }
  }

  function foulBall() {
    endAtBat(false);
    showBanner('foul ball.', '');
  }

  function hit(kind, points) {
    endAtBat(false);
    score += points;
    scoreNum.textContent = score;
    showBanner(kind, 'hit');
  }

  pitchBtn.addEventListener('click', startPitch);

  swingBtn.addEventListener('click', () => {
    if (!pitchActive) return;
    batterBat.classList.remove('swinging');
    void batterBat.offsetWidth;
    batterBat.classList.add('swinging');
    const now = performance.now();
    const idealArrival = pitchStart + pitchDuration;
    const diff = Math.abs(now - idealArrival);

    if (diff <= 60) hit('HOME RUN!', 4);
    else if (diff <= 150) hit('triple!', 3);
    else if (diff <= 260) hit('double.', 2);
    else if (diff <= 400) hit('single.', 1);
    else if (diff <= pitchDuration * 0.9) foulBall();
    else strikeOut('swinging');
  });

  function gameOver() {
    setTimeout(() => {
      finalScore.textContent = score;
      let comment = 'final score.';
      if (score === 0) comment = "tough inning. everybody has one.";
      else if (score < 6) comment = "you'll get 'em next time.";
      else if (score < 14) comment = "solid at-bats.";
      else comment = "backyard legend.";
      finalComment.textContent = comment;
      finalScreen.classList.add('show');
    }, 700);
  }

  retryBtn.addEventListener('click', () => {
    score = 0; strikes = 0; outs = 0;
    scoreNum.textContent = '0';
    updateDots(strikeDots, 0);
    updateDots(outDots, 0);
    finalScreen.classList.remove('show');
    showBanner('', '');
    resetBallVisual();
    resetFigures();
    pitchBtn.disabled = false;
    swingBtn.disabled = true;
  });
</script>
</body>
</html>
